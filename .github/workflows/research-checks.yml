name: Research correctness checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-research.txt
      - name: Install CPU research dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-research.txt
      - name: Require scientific dependencies and run correctness tests
        run: |
          python -c "import torch, numpy, scipy"
          python -m unittest discover -s tests -v
          python scripts/validate_workspace.py
          python scripts/verify_round1.py
          python scripts/verify_round2.py
          python scripts/verify_round3.py
          python scripts/verify_round4.py
          python scripts/verify_round5.py
          python scripts/verify_round6.py
          python scripts/verify_round7.py
